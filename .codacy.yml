---
# SQL analyzers apply non-SQLite dialect and organization-specific RAC_* policies to these
# immutable SQLite migrations. Java code and tests remain fully analyzed.
#
# The WP-05 Mineflayer bots execute only under Node.js inside disposable GitHub Actions
# acceptance servers. The connected Codacy JavaScript policies are browser/Opera-Mini and
# legacy-ECMAScript rules that explicitly forbid required Node APIs, Promise/async-await,
# CommonJS loading, and modern JavaScript. Exclude only these Node-only runtime drivers;
# the shell harness, acceptance Java plugin, production Java, and Java tests remain analyzed.
exclude_paths:
  - "adapters-sqlite/src/main/resources/db/migration/V1__foundation.sql"
  - "adapters-sqlite/src/main/resources/db/migration/V2__template_revision_rollout.sql"
  - "adapters-sqlite/src/main/resources/db/migration/V3__mutation_queue_controls.sql"
  - "adapters-sqlite/src/main/resources/db/migration/V4__template_editor_confirmations.sql"
  - "adapters-sqlite/src/main/resources/db/migration/V5__destructive_administration.sql"
