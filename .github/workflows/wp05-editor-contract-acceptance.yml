name: WP-05 Editor Contract Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-editor-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Build exact head and prepare disposable Paper server
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          ROOT=/tmp/wp05-editor-contract
          mkdir -p "$ROOT/server/plugins/EnthusiaLoreItems" "$ROOT/evidence" "$ROOT/bot"
          PLUGIN_JAR="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          HARNESS_JAR="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          cp "$PLUGIN_JAR" "$ROOT/server/plugins/EnthusiaLoreItems.jar"
          cp "$HARNESS_JAR" "$ROOT/server/plugins/WP05AcceptanceHarness.jar"
          sha256sum "$PLUGIN_JAR" > "$ROOT/evidence/plugin-sha256.txt"
          sha256sum "$HARNESS_JAR" > "$ROOT/evidence/harness-sha256.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$ROOT/evidence/source-head.txt"
          java -version 2> "$ROOT/evidence/java-version.txt"
          cat > "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 500
          duplicate-warning-interval-seconds: 300
          mutation-budget-per-tick: 16
          EOF
          cp "$ROOT/server/plugins/EnthusiaLoreItems/config.yml" "$ROOT/evidence/loreitems-config.yml"
          cd "$ROOT/server"
          curl -fsSL "$PAPER_URL" -o paper.jar
          echo "$PAPER_SHA256  paper.jar" | sha256sum -c -
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 editor contract acceptance
          EOF
          cd "$ROOT/bot"
          npm init -y >/dev/null
          npm install --save-exact mineflayer@4.35.0 >"$ROOT/evidence/npm-install.log" 2>&1
          npm list --depth=0 > "$ROOT/evidence/npm-list.txt"
          cat > bot.js <<'EOF'
          const mineflayer=require('mineflayer'), fs=require('fs')
          const root='/tmp/wp05-editor-contract'
          const bot=mineflayer.createBot({host:'127.0.0.1',port:25565,username:'Wp05EditorBot',version:'1.21.11',auth:'offline'})
          const log=x=>{fs.appendFileSync(`${root}/evidence/bot.log`,`${new Date().toISOString()} ${x}\n`);console.log(x)}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          function componentText(value){
            const seen=new Set()
            const read=current=>{
              if(current==null)return ''
              if(typeof current==='string'||typeof current==='number'||typeof current==='boolean')return String(current)
              if(Array.isArray(current))return current.map(read).join('')
              if(typeof current!=='object'||seen.has(current))return ''
              seen.add(current)
              try{
                if(Object.prototype.hasOwnProperty.call(current,'value')&&(current.type||Object.keys(current).length<=2)){
                  const unwrapped=read(current.value);if(unwrapped)return unwrapped
                }
                const parts=[]
                if(Object.prototype.hasOwnProperty.call(current,'text'))parts.push(read(current.text))
                for(const key of ['extra','with','children','siblings','content'])if(Object.prototype.hasOwnProperty.call(current,key))parts.push(read(current[key]))
                if(parts.some(Boolean))return parts.join('')
                for(const [key,child] of Object.entries(current)){
                  if(['type','color','bold','italic','underlined','strikethrough','obfuscated','insertion','font'].includes(key))continue
                  parts.push(read(child))
                }
                return parts.join('')
              }finally{seen.delete(current)}
            }
            return read(value)
          }
          const normalize=value=>componentText(value).replace(/§./g,'').replace(/\s+/g,' ').trim().toLowerCase()
          const title=()=>bot.currentWindow ? componentText(bot.currentWindow.title) : ''
          const waitWindow=async fragment=>{
            for(let i=0;i<160;i++){
              if(bot.currentWindow && normalize(title()).includes(normalize(fragment))) return
              await sleep(100)
            }
            throw new Error(`window '${fragment}' not open; current=${title()}`)
          }
          const waitNoWindow=async()=>{for(let i=0;i<160;i++){if(!bot.currentWindow)return;await sleep(100)};throw new Error('window did not close')}
          const click=async slot=>{await bot.clickWindow(slot,0,0)}
          const itemText=item=>item?[item.customName,item.displayName,item.components,item.nbt].map(componentText).join(' '):''
          const findSlot=label=>{
            if(!bot.currentWindow)throw new Error(`cannot find '${label}' without an open window`)
            const wanted=normalize(label)
            const limit=Number.isInteger(bot.currentWindow.inventoryStart)?bot.currentWindow.inventoryStart:bot.currentWindow.slots.length
            const matches=[]
            for(let slot=0;slot<limit;slot++){
              const item=bot.currentWindow.slots[slot]
              if(item&&normalize(itemText(item)).startsWith(wanted))matches.push({slot,text:itemText(item)})
            }
            if(matches.length!==1){
              const visible=bot.currentWindow.slots.slice(0,limit).map((item,slot)=>item?{slot,text:itemText(item)}:null).filter(Boolean)
              throw new Error(`GUI item '${label}' matched ${matches.length} slots; visible=${JSON.stringify(visible)}`)
            }
            return matches[0].slot
          }
          const clickLabel=async label=>{const slot=findSlot(label);log(`GUI_CLICK label=${label} slot=${slot}`);await click(slot)}
          async function openManagement(){bot.chat('/loreitems browse');await waitWindow('Lore definitions');await click(0);await waitWindow('Template management')}
          async function openEditor(){await openManagement();await clickLabel('Edit template');await waitWindow('Template editor')}
          async function edit(label,input){await clickLabel(label);await waitNoWindow();bot.chat(`/loreitems set ${input}`);await waitWindow('Template editor');log(`EDIT_OK action=${label} input=${input}`)}
          async function cancelPreview(){await openEditor();await edit('Custom name','literal Cancel Candidate');await clickLabel('Preview and confirm');await waitWindow('Confirm template revision');log(`CANCEL_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`);await clickLabel('Cancel draft');await waitWindow('Template management')}
          async function invalidInput(){await openEditor();await clickLabel('Base material');await waitNoWindow();bot.chat('/loreitems set definitely:not_a_material');await sleep(600);bot.chat('/loreitems set cancel');await waitWindow('Template editor');await clickLabel('Cancel draft');await waitWindow('Template management');log('INVALID_REJECTED_AND_CANCELLED')}
          async function confirmMatrix(){
            await openEditor();await edit('Base material','minecraft:netherite_sword');await edit('Custom name','solid #112233 Matrix Name');await edit('Item name','gradient #ff0000,#0000ff Matrix Item');await edit('Lore lines','add literal First line');await edit('Lore lines','add gradient #ff0000,#0000ff Gradient line');await edit('Lore lines','edit 1 solid #00ff00 Edited first');await edit('Lore lines','move 2 1');await edit('Lore lines','remove 1');await edit('Enchantments','set minecraft:sharpness 7');await edit('Enchantments','tooltip hidden');await edit('Enchantments','tooltip visible');await edit('Glint override','true');await edit('Damage and unbreakable','damage 15');await edit('Damage and unbreakable','unbreakable true');await edit('Attributes','set minecraft:attack_damage enthusia:wp05_matrix add_number 4.5 mainhand');await edit('Item model','enthusia:wp05_blade');await edit('Maximum stack size','1');await edit('Custom model data','floats 1.5,2.25');await edit('Custom model data','flags true,false,true');await edit('Custom model data','strings first|second_value');await edit('Custom model data','colors #010203,#abcdef');await edit('Item flags','add hide_attributes');await edit('Tooltip controls','hide true');await edit('Tooltip controls','hide false');await edit('Tooltip controls','style enthusia:wp05_style');await clickLabel('Preview and confirm');await waitWindow('Confirm template revision');log(`MATRIX_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`);await clickLabel('Confirm revision');await waitWindow('Template management');log('MATRIX_CONFIRMED')
          }
          async function replaceHeld(cancel){await openManagement();await clickLabel('Replace from held item');await waitWindow('Confirm template revision');log(`${cancel?'REPLACE_CANCEL':'REPLACE_CONFIRM'}_PREVIEW ${JSON.stringify(bot.currentWindow.slots[15]||null)}`);await clickLabel(cancel?'Cancel draft':'Confirm revision');await waitWindow('Template management')}
          bot.on('message',m=>log(`CHAT ${m.toString()}`));bot.on('error',e=>log(`ERROR ${e.stack||e}`));bot.on('kicked',r=>log(`KICKED ${String(r)}`))
          bot.once('spawn',async()=>{try{log(`SPAWN uuid=${bot.player.uuid} username=${bot.username}`);fs.writeFileSync(`${root}/bot.uuid`,`${bot.player.uuid}\n`);while(!fs.existsSync(`${root}/go-cancel`))await sleep(100);await cancelPreview();fs.writeFileSync(`${root}/done-cancel`,'ok\n');while(!fs.existsSync(`${root}/go-invalid`))await sleep(100);await invalidInput();fs.writeFileSync(`${root}/done-invalid`,'ok\n');while(!fs.existsSync(`${root}/go-matrix`))await sleep(100);await confirmMatrix();fs.writeFileSync(`${root}/done-matrix`,'ok\n');while(!fs.existsSync(`${root}/go-replace-cancel`))await sleep(100);await replaceHeld(true);fs.writeFileSync(`${root}/done-replace-cancel`,'ok\n');while(!fs.existsSync(`${root}/go-replace-confirm`))await sleep(100);await replaceHeld(false);fs.writeFileSync(`${root}/done-replace-confirm`,'ok\n');while(!fs.existsSync(`${root}/bot.stop`))await sleep(100);bot.quit('acceptance complete')}catch(e){log(`FATAL ${e.stack||e}`);fs.writeFileSync(`${root}/bot.failed`,String(e.stack||e));bot.quit('acceptance failed')}})
          EOF

      - name: Execute ACC-EDIT-001 and ACC-EDIT-002
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-editor-contract;DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db";cd "$ROOT/server";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$ROOT/evidence/server.log" 2>&1 & SERVER_PID=$!
          cleanup(){ touch "$ROOT/bot.stop" || true;if [[ -n "${BOT_PID:-}" ]];then wait "$BOT_PID" || true;fi;if kill -0 "$SERVER_PID" 2>/dev/null;then echo stop >&3 || true;wait "$SERVER_PID" || true;fi;};trap cleanup EXIT
          for _ in $(seq 1 180);do grep -q 'Queued direct-delivery processing is active.' "$ROOT/evidence/server.log"&&grep -q 'WP-05 deterministic acceptance helper is active' "$ROOT/evidence/server.log"&&break;kill -0 "$SERVER_PID" 2>/dev/null||{ cat "$ROOT/evidence/server.log";exit 1;};sleep 1;done
          (cd "$ROOT/bot"&&node bot.js)>"$ROOT/evidence/bot-stdout.log" 2>&1 & BOT_PID=$!;for _ in $(seq 1 90);do test -s "$ROOT/bot.uuid"&&break;sleep 1;done;test -s "$ROOT/bot.uuid";echo 'op Wp05EditorBot' >&3;echo 'wp05accept source Wp05EditorBot sword' >&3;sleep .5;echo 'wp05accept perform Wp05EditorBot loreitems create acc_edit_contract Editor Contract' >&3
          python3 - "$DB" <<'PY'
          import sqlite3,sys,time
          for _ in range(120):
              try:
                  with sqlite3.connect(sys.argv[1]) as c:
                      row=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract' and deleted_at is null").fetchone()
                      if row and row[1]==1: break
              except sqlite3.Error: pass
              time.sleep(.25)
          else: raise SystemExit('definition creation did not converge')
          PY
          echo 'wp05accept perform Wp05EditorBot loreitems give acc_edit_contract' >&3
          python3 - "$DB" <<'PY'
          import sqlite3,sys,time
          for _ in range(180):
              with sqlite3.connect(sys.argv[1]) as c:
                  did=c.execute("select definition_id from lore_definitions where lookup_key='acc_edit_contract'").fetchone()[0];rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall()
                  if len(rows)==1 and rows[0][1:]==(1,1,'ACTIVE'):open('/tmp/wp05-editor-contract/evidence/original-instance.txt','w').write(str(rows[0][0])+'\n');break
              time.sleep(.25)
          else: raise SystemExit('initial online instance was not delivered')
          PY
          touch "$ROOT/go-cancel";for _ in $(seq 1 160);do test -f "$ROOT/done-cancel"&&break;test ! -f "$ROOT/bot.failed"||{ cat "$ROOT/bot.failed";exit 1;};sleep .25;done;test -f "$ROOT/done-cancel"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();assert rev==1,rev;assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==1
          PY
          touch "$ROOT/go-invalid";for _ in $(seq 1 160);do test -f "$ROOT/done-invalid"&&break;test ! -f "$ROOT/bot.failed"||{ cat "$ROOT/bot.failed";exit 1;};sleep .25;done;test -f "$ROOT/done-invalid"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();assert rev==1,rev;assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==1
          PY
          touch "$ROOT/go-matrix";for _ in $(seq 1 360);do test -f "$ROOT/done-matrix"&&break;test ! -f "$ROOT/bot.failed"||{ cat "$ROOT/bot.failed";exit 1;};sleep .25;done;test -f "$ROOT/done-matrix"
          python3 - "$DB" <<'PY' | tee "$ROOT/evidence/case-results.txt"
          import sqlite3,sys,time
          for _ in range(240):
              with sqlite3.connect(sys.argv[1]) as c:
                  did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall();pending=c.execute("select count(*) from pending_mutations where definition_id=? and mutation_type='TEMPLATE_UPDATE' and state not in ('COMPLETED','CANCELLED')",(did,)).fetchone()[0]
                  if rev==2 and len(rows)==1 and rows[0][1:]==(2,2,'ACTIVE') and pending==0:
                      original=open('/tmp/wp05-editor-contract/evidence/original-instance.txt').read().strip();assert str(rows[0][0])==original;break
              time.sleep(.25)
          else: raise SystemExit('matrix revision did not roll out to online instance')
          print('PASS ACC-EDIT-001: supported GUI/chat field matrix, invalid input, preview cancel, confirmation, bounded rollout')
          PY
          grep -q 'EDIT_OK action=Base material input=minecraft:netherite_sword' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Custom name input=solid #112233 Matrix Name' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Item name input=gradient #ff0000,#0000ff Matrix Item' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Lore lines input=edit 1 solid #00ff00 Edited first' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Enchantments input=set minecraft:sharpness 7' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Enchantments input=tooltip hidden' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Enchantments input=tooltip visible' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Glint override input=true' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Damage and unbreakable input=damage 15' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Damage and unbreakable input=unbreakable true' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Attributes input=set minecraft:attack_damage enthusia:wp05_matrix add_number 4.5 mainhand' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Item model input=enthusia:wp05_blade' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Maximum stack size input=1' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Custom model data input=colors #010203,#abcdef' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Item flags input=add hide_attributes' "$ROOT/evidence/bot.log";grep -q 'EDIT_OK action=Tooltip controls input=style enthusia:wp05_style' "$ROOT/evidence/bot.log";grep -q 'INVALID_REJECTED_AND_CANCELLED' "$ROOT/evidence/bot.log"
          echo 'wp05accept source Wp05EditorBot uncommon' >&3;sleep .75;echo 'data get entity Wp05EditorBot Inventory' >&3;sleep .5;touch "$ROOT/go-replace-cancel";for _ in $(seq 1 160);do test -f "$ROOT/done-replace-cancel"&&break;test ! -f "$ROOT/bot.failed"||{ cat "$ROOT/bot.failed";exit 1;};sleep .25;done;test -f "$ROOT/done-replace-cancel"
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();assert rev==2,rev;assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==2
          PY
          touch "$ROOT/go-replace-confirm";for _ in $(seq 1 240);do test -f "$ROOT/done-replace-confirm"&&break;test ! -f "$ROOT/bot.failed"||{ cat "$ROOT/bot.failed";exit 1;};sleep .25;done;test -f "$ROOT/done-replace-confirm"
          python3 - "$DB" <<'PY' | tee -a "$ROOT/evidence/case-results.txt"
          import sqlite3,sys,time
          for _ in range(240):
              with sqlite3.connect(sys.argv[1]) as c:
                  did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall();pending=c.execute("select count(*) from pending_mutations where definition_id=? and mutation_type='TEMPLATE_UPDATE' and state not in ('COMPLETED','CANCELLED')",(did,)).fetchone()[0]
                  if rev==3 and len(rows)==1 and rows[0][1:]==(3,3,'ACTIVE') and pending==0:
                      original=open('/tmp/wp05-editor-contract/evidence/original-instance.txt').read().strip();assert str(rows[0][0])==original;break
              time.sleep(.25)
          else: raise SystemExit('held replacement revision did not roll out')
          print('PASS ACC-EDIT-002: uncommon held template preview/cancel then exact-copy confirmation with identity preserved')
          PY
          echo 'data get entity Wp05EditorBot Inventory' >&3;sleep .75;grep -q 'REPLACE_CANCEL_PREVIEW' "$ROOT/evidence/bot.log";grep -q 'REPLACE_CONFIRM_PREVIEW' "$ROOT/evidence/bot.log";grep -qi 'firework' "$ROOT/evidence/bot.log";grep -q 'WP05 Uncommon Source' "$ROOT/evidence/server.log"
          touch "$ROOT/bot.stop";wait "$BOT_PID";unset BOT_PID;echo stop >&3;wait "$SERVER_PID";exec 3>&-;rm -f server.stdin;trap - EXIT

      - name: Verify restart durability and database integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp05-editor-contract;DB="$ROOT/server/plugins/EnthusiaLoreItems/loreitems.db";cd "$ROOT/server";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$ROOT/evidence/server-restart.log" 2>&1 & PID=$!;trap 'echo stop >&3 || true; wait "$PID" || true' EXIT
          for _ in $(seq 1 180);do grep -q 'Queued direct-delivery processing is active.' "$ROOT/evidence/server-restart.log"&&break;kill -0 "$PID" 2>/dev/null||{ cat "$ROOT/evidence/server-restart.log";exit 1;};sleep 1;done
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:
              did,rev=c.execute("select definition_id,current_revision from lore_definitions where lookup_key='acc_edit_contract'").fetchone();assert rev==3,rev;rows=c.execute("select instance_id,applied_revision,desired_revision,lifecycle_state from lore_instances where definition_id=?",(did,)).fetchall();assert len(rows)==1 and rows[0][1:]==(3,3,'ACTIVE'),rows;assert c.execute('select count(*) from lore_definition_revisions where definition_id=?',(did,)).fetchone()[0]==3;versions=[r[0] for r in c.execute('select version from schema_history order by version')];assert versions==list(range(1,12)),versions;assert c.execute('pragma integrity_check').fetchone()[0]=='ok';assert c.execute('pragma foreign_key_check').fetchall()==[]
          print('restart/integrity PASS')
          PY
          echo stop >&3;wait "$PID";exec 3>&-;trap - EXIT

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp05-editor-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-editor-contract/evidence
          if-no-files-found: error
          retention-days: 30