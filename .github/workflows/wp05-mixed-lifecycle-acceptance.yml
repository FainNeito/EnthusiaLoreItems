name: WP-05 Mixed Work Lifecycle Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wp05-mixed-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-work-reload-shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_URL: https://fill-data.papermc.io/v1/objects/e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8/paper-1.21.11-116.jar
      PAPER_SHA256: e708e8c132dc143ffd73528cccb9532e2eb17628b1a0eee74469bf466c7003f8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.14.3"
      - name: Prepare exact-head mixed-work fixture
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :plugin:shadowJar :acceptance-harness:jar -PreleaseVersion=1.0.0-rc.1
          R=/tmp/wp05-life;mkdir -p "$R/server/plugins/EnthusiaLoreItems" "$R/evidence" "$R/bot";P="$(find plugin/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";H="$(find acceptance-harness/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*'|head -n1)";cp "$P" "$R/server/plugins/EnthusiaLoreItems.jar";cp "$H" "$R/server/plugins/WP05AcceptanceHarness.jar";sha256sum "$P">"$R/evidence/plugin-sha256.txt";printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}">"$R/evidence/source-head.txt"
          cat >"$R/server/plugins/EnthusiaLoreItems/config.yml" <<'EOF'
          database-busy-timeout-millis: 5000
          database-queue-capacity: 64
          database-shutdown-timeout-seconds: 3
          delivery-claim-batch-size: 8
          delivery-claim-lease-seconds: 30
          duplicate-warning-interval-seconds: 300
          default-page-size: 45
          max-page-size: 100
          mutation-budget-per-tick: 2
          shared-containers-allowed: true
          EOF
          cd "$R/server";curl -fsSL "$PAPER_URL" -o paper.jar;echo "$PAPER_SHA256  paper.jar"|sha256sum -c -;printf 'eula=true\n'>eula.txt;cat >server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          white-list=false
          server-port=25565
          motd=WP05 mixed lifecycle
          EOF
          cd "$R/bot";npm init -y>/dev/null;npm install --save-exact mineflayer@4.35.0>"$R/evidence/npm.log" 2>&1;cat >bot.js <<'EOF'
          const m=require('mineflayer'),fs=require('fs'),r='/tmp/wp05-life',name=process.argv[2],sleep=ms=>new Promise(x=>setTimeout(x,ms))
          const q=name.toLowerCase(),b=m.createBot({host:'127.0.0.1',port:25565,username:name,version:'1.21.11',auth:'offline'})
          function text(value){const seen=new Set();const read=v=>{if(v==null)return '';if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(read).join('');if(typeof v!=='object'||seen.has(v))return '';seen.add(v);try{if(Object.prototype.hasOwnProperty.call(v,'value')&&(v.type||Object.keys(v).length<=2)){const u=read(v.value);if(u)return u}const p=[];if(Object.prototype.hasOwnProperty.call(v,'text'))p.push(read(v.text));for(const k of ['extra','with','children','siblings','content'])if(Object.prototype.hasOwnProperty.call(v,k))p.push(read(v[k]));if(p.some(Boolean))return p.join('');for(const [k,c] of Object.entries(v)){if(['type','color','bold','italic','underlined','strikethrough','obfuscated','insertion','font'].includes(k))continue;p.push(read(c))}return p.join('')}finally{seen.delete(v)}};return read(value)}
          const norm=v=>text(v).replace(/§./g,'').replace(/\s+/g,' ').trim().toLowerCase()
          const itemText=i=>i?[i.customName,i.displayName,i.components,i.nbt].map(text).join(' '):''
          function slot(label){if(!b.currentWindow)throw Error(`no window for ${label}`);const wanted=norm(label),limit=Number.isInteger(b.currentWindow.inventoryStart)?b.currentWindow.inventoryStart:b.currentWindow.slots.length,m=[];for(let i=0;i<limit;i++){const it=b.currentWindow.slots[i];if(it&&norm(itemText(it)).startsWith(wanted))m.push(i)}if(m.length!==1)throw Error(`GUI item ${label} matched ${m.length}`);return m[0]}
          async function file(p){for(let i=0;i<1200;i++){if(fs.existsSync(p))return;await sleep(100)}throw Error(p)}
          async function win(x){for(let i=0;i<200;i++){if(b.currentWindow&&norm(b.currentWindow.title).includes(norm(x)))return;await sleep(100)}throw Error(`window ${x}`)}
          async function noWin(){for(let i=0;i<160;i++){if(!b.currentWindow)return;await sleep(100)}throw Error('window did not close')}
          async function click(n){await b.clickWindow(n,0,0)}
          async function clickLabel(label){await click(slot(label))}
          async function edit(){b.chat('/loreitems browse');await win('Lore definitions');await click(0);await win('Template management');await clickLabel('Edit template');await win('Template editor');await clickLabel('Custom name');await noWin();b.chat('/loreitems set literal Lifecycle Revision Two');await win('Template editor');await clickLabel('Preview and confirm');await win('Confirm template revision');await clickLabel('Confirm revision');await win('Template management');fs.writeFileSync(`${r}/edit.done`,'ok\n')}
          b.once('spawn',async()=>{try{fs.writeFileSync(`${r}/${q}.uuid`,`${b.player.uuid}\n`);if(name==='Wp05LifeAdmin'){await file(`${r}/edit.go`);await edit()}while(!fs.existsSync(`${r}/${q}.stop`))await sleep(100);b.quit('transition')}catch(e){fs.writeFileSync(`${r}/${q}.failed`,String(e.stack||e));process.exit(1)}})
          EOF
      - name: Execute ACC-LIFE-001 and ACC-LIFE-002 with four pending state machines
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/wp05-life;S="$R/server";E="$R/evidence";DB="$S/plugins/EnthusiaLoreItems/loreitems.db";CFG="$S/plugins/EnthusiaLoreItems/config.yml";G="$S/plugins/EnthusiaLoreItems/groups";cd "$S"
          start_server(){ local l="$1";rm -f server.stdin;mkfifo server.stdin;exec 3<>server.stdin;java -Xms512M -Xmx1536M -Dpaper.disablePluginRemapping=true -jar paper.jar --nogui <server.stdin >"$l" 2>&1 & SPID=$!;for _ in $(seq 1 180);do if grep -q 'Mass distribution delivery, identity binding, marker recovery, and commands are active.' "$l"&&grep -q 'WP-05 deterministic acceptance helper is active' "$l";then return;fi;kill -0 "$SPID" 2>/dev/null||{ cat "$l";return 1;};sleep 1;done;cat "$l";return 1;}
          stop_server(){ local a b;a="$(date +%s%3N)";echo stop >&3;for _ in $(seq 1 200);do if ! kill -0 "$SPID" 2>/dev/null;then break;fi;sleep .1;done;if kill -0 "$SPID" 2>/dev/null;then echo 'server shutdown timed out after 20 seconds' >&2;return 1;fi;wait "$SPID";b="$(date +%s%3N)";SHUTDOWN_MS=$((b-a));exec 3>&-;rm -f server.stdin;}
          start_bot(){ local n="$1" q p;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";rm -f "$R/$q.uuid" "$R/$q.stop" "$R/$q.failed";(cd "$R/bot"&&node bot.js "$n")>"$E/$q.log" 2>&1 & p=$!;echo "$p">"$R/$q.pid";for _ in $(seq 1 80);do test -s "$R/$q.uuid"&&return;kill -0 "$p" 2>/dev/null||return 1;sleep .25;done;return 1;}
          stop_bot(){ local n="$1" q p;q="$(printf '%s' "$n"|tr '[:upper:]' '[:lower:]')";test -f "$R/$q.pid"||return 0;p="$(cat "$R/$q.pid")";touch "$R/$q.stop";for _ in $(seq 1 30);do kill -0 "$p" 2>/dev/null||break;sleep .2;done;kill "$p" 2>/dev/null||true;wait "$p" 2>/dev/null||true;rm -f "$R/$q.pid";}
          kill_bots(){ for f in "$R"/*.pid;do test -e "$f"||continue;p="$(cat "$f")";kill "$p" 2>/dev/null||true;wait "$p" 2>/dev/null||true;rm -f "$f";done;}
          wait_sql(){ local q="$1";for _ in $(seq 1 240);do if python3 - "$DB" "$q" <<'PY'
          import sqlite3,sys
          try:
              with sqlite3.connect(sys.argv[1]) as c:r=c.execute(sys.argv[2]).fetchone();raise SystemExit(0 if r and r[0] else 1)
          except sqlite3.OperationalError:raise SystemExit(1)
          PY
            then return;fi;sleep .25;done;echo "SQL timeout: $q" >&2;return 1;}
          START="$(date -u +%FT%TZ)";L1="$E/server-before.log";start_server "$L1";for N in Wp05LifeAdmin Wp05LifeUpdate Wp05LifeDestruct Wp05LifeDelivery Wp05LifeCampaign;do start_bot "$N";done;echo 'op Wp05LifeAdmin' >&3
          U="$(tr -d '\r\n'<"$R/wp05lifeupdate.uuid")";X="$(tr -d '\r\n'<"$R/wp05lifedestruct.uuid")";D="$(tr -d '\r\n'<"$R/wp05lifedelivery.uuid")";C="$(tr -d '\r\n'<"$R/wp05lifecampaign.uuid")"
          echo 'wp05accept source Wp05LifeAdmin sword' >&3;sleep .5;echo 'wp05accept perform Wp05LifeAdmin loreitems create life_update Lifecycle Update' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='life_update' and current_revision=1";echo 'loreitems give life_update Wp05LifeUpdate' >&3;wait_sql "select count(*)=1 from lore_instances i join lore_definitions d on d.definition_id=i.definition_id join instance_current_state s on s.instance_id=i.instance_id where d.lookup_key='life_update' and s.location_key='player:$U'";stop_bot Wp05LifeUpdate;touch "$R/edit.go";for _ in $(seq 1 200);do test -f "$R/edit.done"&&break;test -f "$R/wp05lifeadmin.failed"&&{ cat "$R/wp05lifeadmin.failed";exit 1;};sleep .25;done;test -f "$R/edit.done";wait_sql "select count(*)=1 from lore_instances i join lore_definitions d on d.definition_id=i.definition_id where d.lookup_key='life_update' and i.applied_revision=1 and i.desired_revision=2"
          echo 'wp05accept source Wp05LifeAdmin helmet' >&3;sleep .5;echo 'wp05accept perform Wp05LifeAdmin loreitems create life_destruct Lifecycle Destructive' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='life_destruct'";echo 'loreitems give life_destruct Wp05LifeDestruct' >&3;wait_sql "select count(*)=1 from lore_instances i join lore_definitions d on d.definition_id=i.definition_id join instance_current_state s on s.instance_id=i.instance_id where d.lookup_key='life_destruct' and s.location_key='player:$X'";stop_bot Wp05LifeDestruct;XDEF="$(python3 - "$DB" <<'PY'
          import sqlite3
          with sqlite3.connect('/tmp/wp05-life/server/plugins/EnthusiaLoreItems/loreitems.db') as c:print(c.execute("select definition_id from lore_definitions where lookup_key='life_destruct'").fetchone()[0])
          PY
          )";echo "loreitems purge $XDEF" >&3;sleep 1;TOK="$(grep -F 'Confirm with: /loreitems confirm-purge ' "$L1"|tail -n1|sed -E 's/.*confirm-purge ([^ ]+).*/\1/')";test -n "$TOK";echo "loreitems confirm-purge $TOK" >&3;wait_sql "select count(*)=1 from destructive_operations where definition_id='$XDEF' and state='ACTIVE'";XOP="$(python3 - "$DB" "$XDEF" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as c:rows=c.execute("select operation_id from destructive_operations where definition_id=? and state='ACTIVE'",(sys.argv[2],)).fetchall();assert len(rows)==1,rows;print(rows[0][0])
          PY
          )"
          stop_bot Wp05LifeDelivery;stop_bot Wp05LifeCampaign;echo 'wp05accept source Wp05LifeAdmin food' >&3;sleep .5;echo 'wp05accept perform Wp05LifeAdmin loreitems create life_delivery Lifecycle Delivery' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='life_delivery'";echo 'loreitems give life_delivery Wp05LifeDelivery' >&3;wait_sql "select count(*)=1 from direct_deliveries where player_id='$D' and state='PENDING'"
          echo 'wp05accept source Wp05LifeAdmin uncommon' >&3;sleep .5;echo 'wp05accept perform Wp05LifeAdmin loreitems create life_campaign Lifecycle Campaign' >&3;wait_sql "select count(*)=1 from lore_definitions where lookup_key='life_campaign'";mkdir -p "$G/completed" "$G/cancelled";cat >"$G/life.yml" <<'EOF'
          display-name: Lifecycle Campaign
          players:
            - Wp05LifeCampaign
          EOF
          test -f "$G/life.yml";echo 'loredistribution reload' >&3;sleep 2;echo 'loredistribution preview life.yml life_campaign' >&3;sleep 2;CID="$(grep -F 'Campaign: ' "$L1"|tail -n1|sed -E 's/.*Campaign: ([0-9a-fA-F-]{36}).*/\1/')";test -n "$CID";echo "loredistribution confirm $CID" >&3;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CID' and state='ACTIVE'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$CID' and player_id='$C' and state='QUEUED_OFFLINE'"
          python3 - "$CFG" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text();assert s.count('shared-containers-allowed: true')==1;p.write_text(s.replace('shared-containers-allowed: true','shared-containers-allowed: false'))
          PY
          cp "$CFG" "$E/config-valid.yml";M="$(wc -l<"$L1")";echo 'loreitems reload' >&3;for _ in $(seq 1 100);do tail -n +"$M" "$L1"|grep -Fq 'LoreItems configuration reload applied:'&&break;sleep .25;done;tail -n +"$M" "$L1"|grep -Fq 'LoreItems configuration reload applied:';cp "$CFG" "$E/last-good.yml";printf '\ndefault-page-size: invalid\n'>>"$CFG";M="$(wc -l<"$L1")";echo 'loreitems reload' >&3;for _ in $(seq 1 100);do tail -n +"$M" "$L1"|grep -Fq 'LoreItems configuration reload rejected:'&&break;sleep .25;done;tail -n +"$M" "$L1"|grep -Fq 'LoreItems configuration reload rejected:';cp "$E/last-good.yml" "$CFG"
          wait_sql "select count(*)=1 from direct_deliveries where player_id='$D' and state='PENDING'";wait_sql "select count(*)=1 from destructive_operations where operation_id='$XOP' and state='ACTIVE'";wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CID' and state='ACTIVE'";wait_sql "select count(*)=1 from lore_instances i join lore_definitions d on d.definition_id=i.definition_id where d.lookup_key='life_update' and i.applied_revision=1 and i.desired_revision=2"
          stop_bot Wp05LifeAdmin;stop_server;kill_bots;PENDING_SHUTDOWN_MS="$SHUTDOWN_MS";echo "$PENDING_SHUTDOWN_MS">"$E/shutdown-ms.txt";test "$PENDING_SHUTDOWN_MS" -lt 20000
          L2="$E/server-after.log";start_server "$L2";wait_sql "select count(*)=1 from destructive_operations where operation_id='$XOP' and state='ACTIVE'";wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CID' and state='ACTIVE'";wait_sql "select count(*)=1 from direct_deliveries where player_id='$D' and state='PENDING'"
          start_bot Wp05LifeUpdate;wait_sql "select count(*)=1 from lore_instances i join lore_definitions d on d.definition_id=i.definition_id where d.lookup_key='life_update' and i.applied_revision=2 and i.desired_revision=2";stop_bot Wp05LifeUpdate
          start_bot Wp05LifeDestruct;wait_sql "select count(*)=1 from destructive_operations where operation_id='$XOP' and state='COMPLETED'";stop_bot Wp05LifeDestruct
          start_bot Wp05LifeDelivery;wait_sql "select count(*)=1 from direct_deliveries where player_id='$D' and state='COMPLETED'";stop_bot Wp05LifeDelivery
          start_bot Wp05LifeCampaign;wait_sql "select count(*)=1 from distribution_campaigns where campaign_id='$CID' and state='COMPLETED'";wait_sql "select count(*)=1 from distribution_recipients where campaign_id='$CID' and state='DELIVERED'";stop_bot Wp05LifeCampaign
          stop_server;kill_bots;END="$(date -u +%FT%TZ)";python3 - "$DB" "$START" "$END" "$PENDING_SHUTDOWN_MS" "$XOP" "$CID" <<'PY'|tee "$E/result.json"
          import json,sqlite3,sys
          db,start,end,shutdown_ms,operation_id,campaign_id=sys.argv[1:]
          with sqlite3.connect(db) as c:
              integrity=c.execute('pragma integrity_check').fetchone()[0]
              foreign_keys=[list(r) for r in c.execute('pragma foreign_key_check')]
              operation=c.execute('select state from destructive_operations where operation_id=?',(operation_id,)).fetchone()
              campaign=c.execute('select state from distribution_campaigns where campaign_id=?',(campaign_id,)).fetchone()
              update=c.execute("select i.applied_revision,i.desired_revision from lore_instances i join lore_definitions d on d.definition_id=i.definition_id where d.lookup_key='life_update'").fetchone()
              assert integrity=='ok' and not foreign_keys
              assert operation==('COMPLETED',),operation
              assert campaign==('COMPLETED',),campaign
              assert update==(2,2),update
          print(json.dumps({'cases':{'ACC-LIFE-001':'PASS','ACC-LIFE-002':'PASS'},'source_head':open('/tmp/wp05-life/evidence/source-head.txt').read().strip(),'started_at':start,'finished_at':end,'shutdown_millis':int(shutdown_ms),'pending_state_machines':['direct-delivery','template-update','destructive','campaign'],'valid_reload_preserved_pending_work':True,'invalid_reload_preserved_last_good_and_pending_work':True,'restart_natural_reaccess_converged_sequentially':True,'integrity':integrity,'foreign_key_violations':foreign_keys},indent=2))
          PY
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp05-mixed-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/wp05-life/evidence
          if-no-files-found: error
          retention-days: 30