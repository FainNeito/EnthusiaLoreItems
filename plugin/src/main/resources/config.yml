# Startup-created storage and worker settings require a server restart when changed.
database-busy-timeout-millis: 5000
database-queue-capacity: 256
database-shutdown-timeout-seconds: 10
delivery-claim-batch-size: 32
delivery-claim-lease-seconds: 30
duplicate-warning-interval-seconds: 300
default-page-size: 45
max-page-size: 100
mutation-budget-per-tick: 16

# This policy is read from the live atomic snapshot and may be hot reloaded.
shared-containers-allowed: true

crown-first-award-enabled: false
crown-first-award-definition-id: ""
crown-first-award-revision: 0

# Requires the verified Paper 26.2 offline save layout; activate only after TEST acceptance.
crown-reclamation-offline-enabled: false
crown-recovery-events-enabled: false
